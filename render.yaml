databases:
  - name: fieldnotes-pbl-intelligence-db
    databaseName: fieldnotes
    user: fieldnotes
    plan: free
    region: singapore
    postgresMajorVersion: 17

services:
  - type: web
    name: fieldnotes-pbl-intelligence
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fieldnotes-pbl-intelligence-db
          property: connectionString
